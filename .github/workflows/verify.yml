name: Verify site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm test
      - run: npm run build
        env:
          VERCEL_BACKGROUND_BUILD: "1"
          NEXT_PUBLIC_BACKGROUNDS_BASE_URL: https://media.matthewrmckenzie.com/backgrounds
      - name: Check deployment media and the permanent redirect
        run: |
          test ! -e public/backgrounds/video
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const { redirects } = JSON.parse(readFileSync(".next/routes-manifest.json", "utf8"));
          const video = redirects.find(({ source }) => source === "/backgrounds/video/:path*");
          assert.equal(video?.statusCode, 308);
          assert.equal(video.destination, "https://media.matthewrmckenzie.com/backgrounds/video/:path*");
          NODE
